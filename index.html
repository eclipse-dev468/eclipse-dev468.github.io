<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECLIPSE: PRO LEAGUE 2D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0a0a0f;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden; color: white; user-select: none;
        }

        /* TOP BAR (Monete e Titolo) */
        #topBar {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; box-sizing: border-box;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            z-index: 15;
        }
        .logo { font-size: 1.5em; font-weight: 900; color: #00ff88; text-shadow: 0 0 10px #00ff88; }
        .coins-display {
            background: rgba(0, 0, 0, 0.6); border: 1px solid #ffd700;
            padding: 8px 15px; border-radius: 8px; font-size: 1.2em; color: #ffd700;
            display: flex; align-items: center; gap: 10px;
        }

        /* LAYOUT PRINCIPALE */
        #screenContainer {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        canvas { background-color: #1a2f1a; box-shadow: 0 0 50px rgba(0, 255, 136, 0.2); border-radius: 10px; display: none; }

        /* OVERLAY UI */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10; transition: opacity 0.3s;
        }
        .hidden { display: none !important; }

        /* BOTTONI STILE NEON */
        .btn {
            background: transparent; color: #00ff88; border: 2px solid #00ff88;
            padding: 15px 40px; font-size: 1.2em; font-family: 'Orbitron', sans-serif;
            cursor: pointer; border-radius: 5px; transition: all 0.2s;
            text-transform: uppercase; font-weight: bold; margin: 10px;
            width: 300px;
        }
        .btn:hover { background: #00ff88; color: #0a0a0f; box-shadow: 0 0 30px #00ff88; transform: scale(1.05); }
        .btn-red { color: #e63946; border-color: #e63946; }
        .btn-red:hover { background: #e63946; color: #fff; box-shadow: 0 0 30px #e63946; }

        /* MENU INIZIALE */
        h1 { font-size: 4em; margin: 0; color: #00ff88; text-shadow: 0 0 20px #00ff88; }
        h2 { color: #e63946; margin-bottom: 30px; }

        /* NEGOZIO E SQUADRA LISTE */
        .list-container {
            width: 80%; max-width: 800px; height: 60vh; overflow-y: auto;
            background: rgba(0,0,0,0.5); border: 1px solid #333; border-radius: 10px;
            padding: 20px; margin-top: 20px;
        }
        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; border-bottom: 1px solid #333;
            transition: background 0.2s;
        }
        .item-row:hover { background: rgba(255,255,255,0.05); }
        .item-name { font-size: 1.2em; font-weight: bold; }
        .item-ovr { color: #00ff88; font-size: 1.5em; }
        .item-btn {
            background: #e63946; color: white; border: none; padding: 8px 15px;
            border-radius: 5px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-weight: bold;
        }
        .item-btn:disabled { background: #555; cursor: not-allowed; }

        /* HUD GIOCO */
        #hud { position: absolute; top: 80px; width: 100%; display: flex; justify-content: center; z-index: 5; pointer-events: none; }
        .scoreboard {
            background: rgba(0, 0, 0, 0.8); border: 2px solid #e63946; border-radius: 10px;
            padding: 10px 30px; display: flex; align-items: center; gap: 20px;
            font-size: 2em; font-weight: 900; box-shadow: 0 0 20px rgba(230, 57, 70, 0.5);
        }
        .team-name { color: #fff; font-size: 0.6em; letter-spacing: 2px; }
        #timer { color: #00ff88; }

        /* EFFETTO GOAL */
        .goal-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 6em; color: #00ff88; text-shadow: 0 0 40px #00ff88;
            font-weight: 900; z-index: 20; display: none; animation: popIn 0.5s;
        }
        @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0); } 100% { transform: translate(-50%, -50%) scale(1); } }

        /* RISULTATO FINALE */
        #resultScreen { text-align: center; }
        .final-score { font-size: 5em; color: #fff; margin: 20px 0; text-shadow: 0 0 20px #fff; }
    </style>
</head>
<body>

    <!-- BARRA SUPERIORE -->
    <div id="topBar">
        <div class="logo">ECLIPSE</div>
        <div class="coins-display">
            <span>🪙</span>
            <span id="coinAmount">1000</span> AC
        </div>
    </div>

    <div id="screenContainer">
        <!-- 1. MENU PRINCIPALE -->
        <div id="mainMenu" class="screen">
            <h1>PRO LEAGUE</h1>
            <h2>2D SIMULATION</h2>
            <button class="btn" onclick="startSimulation()">GIOCA PARTITA</button>
            <button class="btn" onclick="openTeam()">LA TUA SQUADRA</button>
            <button class="btn" onclick="openShop()">NEGOZIO</button>
        </div>

        <!-- 2. SCHERMATA SQUADRA -->
        <div id="teamScreen" class="screen hidden">
            <h2>LA TUA SQUADRA</h2>
            <div class="list-container" id="teamList">
                <!-- Lista generata da JS -->
            </div>
            <button class="btn btn-red" onclick="backToMenu()" style="margin-top: 20px;">INDIETRO</button>
        </div>

        <!-- 3. SCHERMATA NEGOZIO -->
        <div id="shopScreen" class="screen hidden">
            <h2>NEGOZIO</h2>
            <div class="list-container" id="shopList">
                <!-- Lista generata da JS -->
            </div>
            <button class="btn btn-red" onclick="backToMenu()" style="margin-top: 20px;">INDIETRO</button>
        </div>

        <!-- 4. PARTITA E HUD -->
        <div id="hud" class="hidden">
            <div class="scoreboard">
                <div class="team-name">SFIDA CUGINI</div>
                <div id="score-home">0</div> - <div id="score-away">0</div>
                <div class="team-name">FC STARS</div>
                <div style="margin-left: 20px; border-left: 1px solid #444; padding-left: 20px;">
                    <span id="timer">01:30</span>
                </div>
            </div>
        </div>
        <div id="goalText" class="goal-text">GOAL!</div>
        <canvas id="gameCanvas"></canvas>

        <!-- 5. RISULTATO FINALE -->
        <div id="resultScreen" class="screen hidden">
            <h2>FINE PARTITA</h2>
            <div class="final-score" id="finalScore">0 - 0</div>
            <button class="btn" onclick="location.reload()">TORNA AL MENU</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. GESTIONE DATI (Monete, Squadra, Negozio)
        // ==========================================
        let coins = 1000;
        
        // Il tuo team (iniziale)
        let myTeam = [
            { name: "ANDREA CUSANNO", ovr: 114, pos: "ATT" },
            { name: "ALBERTO CARRIERI", ovr: 116, pos: "ATT" },
            { name: "J. SMITH", ovr: 65, pos: "POR" },
            { name: "T. MÜLLER", ovr: 68, pos: "DIF" },
            { name: "D. SILVA", ovr: 67, pos: "DIF" }
        ];

        // Giocatori in vendita
        let shopData = [
            { name: "C. ROLANDO", ovr: 99, price: 800 },
            { name: "L. MESSINI", ovr: 98, price: 700 },
            { name: "R. LOKAKO", ovr: 97, price: 600 },
            { name: "K. MBAPPE", ovr: 96, price: 550 },
            { name: "V. OSHIMEN", ovr: 95, price: 520 }
        ];

        function updateCoinsUI() {
            document.getElementById('coinAmount').innerText = coins;
        }

        // ==========================================
        // 2. GESTIONE SCHERMATE (UI)
        // ==========================================
        function backToMenu() {
            document.getElementById('mainMenu').classList.remove('hidden');
            document.getElementById('teamScreen').classList.add('hidden');
            document.getElementById('shopScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
        }

        function openTeam() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('teamScreen').classList.remove('hidden');
            
            const container = document.getElementById('teamList');
            container.innerHTML = '';
            
            // Ordina per OVR
            myTeam.sort((a,b) => b.ovr - a.ovr).forEach(p => {
                container.innerHTML += `
                    <div class="item-row">
                        <div>
                            <div class="item-name">${p.name}</div>
                            <div style="color: #888; font-size: 0.8em;">${p.pos}</div>
                        </div>
                        <div class="item-ovr">${p.ovr} OVR</div>
                    </div>
                `;
            });
        }

        function openShop() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('shopScreen').classList.remove('hidden');
            renderShop();
        }

        function renderShop() {
            const container = document.getElementById('shopList');
            container.innerHTML = '';
            
            shopData.forEach((p, index) => {
                let buttonHtml = `<button class="item-btn" onclick="buyPlayer(${index})" ${coins < p.price ? 'disabled' : ''}>ACQUISTA (${p.price} AC)</button>`;
                
                container.innerHTML += `
                    <div class="item-row">
                        <div>
                            <div class="item-name">${p.name}</div>
                            <div style="color: #00ff88;">${p.ovr} OVR</div>
                        </div>
                        ${buttonHtml}
                    </div>
                `;
            });
        }

        function buyPlayer(index) {
            const player = shopData[index];
            if (coins >= player.price) {
                coins -= player.price;
                myTeam.push({ name: player.name, ovr: player.ovr, pos: "CEN" }); // Aggiungi al team
                shopData.splice(index, 1); // Rimuovi dal negozio
                updateCoinsUI();
                renderShop();
                alert(`Hai acquistato ${player.name}!`);
            }
        }

        // ==========================================
        // 3. MOTORE FISICO E GIOCO (Versione Veloce)
        // ==========================================
        class Vector2 {
            constructor(x = 0, y = 0) { this.x = x; this.y = y; }
            add(v) { this.x += v.x; this.y += v.y; return this; }
            mult(n) { this.x *= n; this.y *= n; return this; }
            div(n) { this.x /= n; this.y /= n; return this; }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            norm() { let m = this.mag(); if (m !== 0) { this.div(m); } return this; }
            dist(v) { let dx = this.x - v.x; let dy = this.y - v.y; return Math.sqrt(dx * dx + dy * dy); }
            static dist(v1, v2) { let dx = v1.x - v2.x; let dy = v1.y - v2.y; return Math.sqrt(dx * dx + dy * dy); }
            clone() { return new Vector2(this.x, this.y); }
        }

        const CANVAS = document.getElementById('gameCanvas');
        const CTX = CANVAS.getContext('2d');
        const FIELD_WIDTH = 1000;
        const FIELD_HEIGHT = 600;
        CANVAS.width = FIELD_WIDTH; CANVAS.height = FIELD_HEIGHT;

        let GAME_STATE = 'MENU'; 
        let matchTime = 90; 
        let lastTimestamp = 0;
        let goalCooldown = 0;
        
        // --- TUNING FISICA (Qui è dove ho velocizzato tutto!) ---
        const SIMULATION_SPEED = 3.0; // Gioco 3x più veloce
        const PLAYER_FORCE = 2.5; // Spinta molto più forte
        const PLAYER_FRICTION = 0.88; // Meno attrito, scivolano di più
        const BALL_FRICTION = 0.97;

        class Entity {
            constructor(x, y, radius, mass, color) {
                this.pos = new Vector2(x, y);
                this.vel = new Vector2(0, 0);
                this.acc = new Vector2(0, 0);
                this.radius = radius; this.mass = mass; this.color = color;
                this.friction = PLAYER_FRICTION; this.restitution = 0.6;
            }
            applyForce(force) { this.acc.add(force); } // Ignoriamo la massa per il movimento, così è più reattivo
            update(dt) {
                if (dt > 0.1) dt = 0.1;
                this.vel.add(this.acc);
                this.pos.x += this.vel.x * dt * 60 * SIMULATION_SPEED;
                this.pos.y += this.vel.y * dt * 60 * SIMULATION_SPEED;
                this.vel.mult(this.friction);
                this.acc.mult(0);
                // Bordi
                if (this.pos.x - this.radius < 0) { this.pos.x = this.radius; this.vel.x *= -this.restitution; }
                if (this.pos.x + this.radius > FIELD_WIDTH) { this.pos.x = FIELD_WIDTH - this.radius; this.vel.x *= -this.restitution; }
                if (this.pos.y - this.radius < 0) { this.pos.y = this.radius; this.vel.y *= -this.restitution; }
                if (this.pos.y + this.radius > FIELD_HEIGHT) { this.pos.y = FIELD_HEIGHT - this.radius; this.vel.y *= -this.restitution; }
            }
            draw(ctx) {
                ctx.beginPath(); ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.fill();
                ctx.shadowBlur = 10; ctx.shadowColor = this.color; ctx.closePath(); ctx.shadowBlur = 0;
            }
        }

        class Ball extends Entity {
            constructor(x, y) { super(x, y, 8, 0.5, '#ffffff'); this.friction = BALL_FRICTION; this.restitution = 0.8; }
            reset() { this.pos = new Vector2(FIELD_WIDTH / 2, FIELD_HEIGHT / 2); this.vel = new Vector2(0, 0); this.acc = new Vector2(0, 0); }
            draw(ctx) { super.draw(ctx); ctx.beginPath(); ctx.arc(this.pos.x, this.pos.y, this.radius * 0.4, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill(); ctx.closePath(); }
        }

        class Player extends Entity {
            constructor(x, y, teamColor, role, isHome) {
                super(x, y, 12, 1, teamColor);
                this.role = role; this.basePos = new Vector2(x, y); this.isHome = isHome;
                this.speed = PLAYER_FORCE;
            }
            updateAI(ball, dt) {
                let distToBall = Vector2.dist(this.pos, ball.pos);
                let target = new Vector2(this.basePos.x, this.basePos.y);
                
                let ballInOpponentHalf = this.isHome ? ball.pos.x > FIELD_WIDTH / 2 : ball.pos.x < FIELD_WIDTH / 2;
                
                if (this.role === 'POR') {
                    target.y = Math.max(FIELD_HEIGHT/2 - 80, Math.min(FIELD_HEIGHT/2 + 80, ball.pos.y));
                    if (distToBall < 150) target.x = ball.pos.x;
                } else {
                    if (distToBall < 250) { // Raggio di inseguimento aumentato
                        target = ball.pos;
                    } else {
                        let offsetX = ballInOpponentHalf ? 150 : -50;
                        target.x = this.basePos.x + offsetX;
                        target.y = this.basePos.y + (ball.pos.y - FIELD_HEIGHT/2) * 0.5;
                    }
                }
                let dir = new Vector2(target.x - this.pos.x, target.y - this.pos.y).norm();
                this.applyForce(dir.mult(this.speed));
                
                if (distToBall < this.radius + ball.radius + 15) {
                    let shootDir = this.isHome ? new Vector2(1, (Math.random() - 0.5) * 0.8).norm() : new Vector2(-1, (Math.random() - 0.5) * 0.8).norm();
                    ball.applyForce(shootDir.mult(20)); // Tiro più potente
                }
            }
        }

        function resolveCollision(e1, e2) {
            let dist = Vector2.dist(e1.pos, e2.pos);
            let minDist = e1.radius + e2.radius;
            if (dist < minDist && dist > 0) {
                let nx = (e2.pos.x - e1.pos.x) / dist;
                let ny = (e2.pos.y - e1.pos.y) / dist;
                let overlap = minDist - dist;
                e1.pos.x -= nx * overlap * 0.5; e1.pos.y -= ny * overlap * 0.5;
                e2.pos.x += nx * overlap * 0.5; e2.pos.y += ny * overlap * 0.5;
                let rvx = e2.vel.x - e1.vel.x; let rvy = e2.vel.y - e1.vel.y;
                let normalVelocity = rvx * nx + rvy * ny;
                if (normalVelocity > 0) return;
                let e = Math.min(e1.restitution, e2.restitution);
                let j = -(1 + e) * normalVelocity / (1/e1.mass + 1/e2.mass);
                let impulseX = j * nx; let impulseY = j * ny;
                e1.vel.x -= impulseX / e1.mass; e1.vel.y -= impulseY / e1.mass;
                e2.vel.x += impulseX / e2.mass; e2.vel.y += impulseY / e2.mass;
            }
        }

        let ball, players = [], scoreHome = 0, scoreAway = 0;

        function initGame() {
            ball = new Ball(FIELD_WIDTH / 2, FIELD_HEIGHT / 2);
            players = [];
            // Casa
            players.push(new Player(FIELD_WIDTH / 3, FIELD_HEIGHT / 2, '#e63946', 'CEN', true));
            players.push(new Player(FIELD_WIDTH / 4, FIELD_HEIGHT / 3, '#e63946', 'DIF', true));
            players.push(new Player(FIELD_WIDTH / 4, FIELD_HEIGHT / 1.5, '#e63946', 'DIF', true));
            players.push(new Player(FIELD_WIDTH / 1.5, FIELD_HEIGHT / 2, '#e63946', 'ATT', true));
            players.push(new Player(50, FIELD_HEIGHT / 2, '#e63946', 'POR', true));
            // Ospiti
            players.push(new Player(FIELD_WIDTH - 50, FIELD_HEIGHT / 2, '#00b894', 'POR', false));
            players.push(new Player(FIELD_WIDTH * 0.75, FIELD_HEIGHT / 3, '#00b894', 'DIF', false));
            players.push(new Player(FIELD_WIDTH * 0.75, FIELD_HEIGHT / 1.5, '#00b894', 'DIF', false));
            players.push(new Player(FIELD_WIDTH * 0.6, FIELD_HEIGHT / 2, '#00b894', 'CEN', false));
            players.push(new Player(FIELD_WIDTH * 0.8, FIELD_HEIGHT / 2, '#00b894', 'ATT', false));

            scoreHome = 0; scoreAway = 0; matchTime = 90;
            document.getElementById('score-home').innerText = "0"; document.getElementById('score-away').innerText = "0";
        }

        function drawField(ctx) {
            ctx.fillStyle = '#1a2f1a'; ctx.fillRect(0, 0, FIELD_WIDTH, FIELD_HEIGHT);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(FIELD_WIDTH / 2, FIELD_HEIGHT / 2, 80, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(FIELD_WIDTH / 2, 0); ctx.lineTo(FIELD_WIDTH / 2, FIELD_HEIGHT); ctx.stroke();
            ctx.strokeRect(0, FIELD_HEIGHT / 2 - 100, 120, 200); ctx.strokeRect(FIELD_WIDTH - 120, FIELD_HEIGHT / 2 - 100, 120, 200);
            ctx.fillStyle = '#fff'; ctx.fillRect(0, FIELD_HEIGHT / 2 - 40, 5, 80); ctx.fillRect(FIELD_WIDTH - 5, FIELD_HEIGHT / 2 - 40, 5, 80);
        }

        function checkGoal() {
            if (ball.pos.x > FIELD_WIDTH - ball.radius && ball.pos.y > FIELD_HEIGHT / 2 - 40 && ball.pos.y < FIELD_HEIGHT / 2 + 40) { scoreHome++; triggerGoal("SFIDA CUGINI"); }
            else if (ball.pos.x < ball.radius && ball.pos.y > FIELD_HEIGHT / 2 - 40 && ball.pos.y < FIELD_HEIGHT / 2 + 40) { scoreAway++; triggerGoal("FC STARS"); }
        }

        function triggerGoal(team) {
            GAME_STATE = 'GOAL'; goalCooldown = 1.0; // Pausa brevissima
            const gt = document.getElementById('goalText'); gt.innerText = `GOAL! ${team}`; gt.style.display = 'block';
            document.getElementById('score-home').innerText = scoreHome; document.getElementById('score-away').innerText = scoreAway;
        }

        function gameLoop(timestamp) {
            let dt = (timestamp - lastTimestamp) / 1000; lastTimestamp = timestamp;

            if (GAME_STATE === 'PLAYING') {
                matchTime -= dt * SIMULATION_SPEED;
                if (matchTime <= 0) {
                    matchTime = 0; GAME_STATE = 'GAMEOVER';
                    document.getElementById('finalScore').innerText = `${scoreHome} - ${scoreAway}`;
                    document.getElementById('resultScreen').classList.remove('hidden');
                }
                let min = Math.floor(matchTime / 60); let sec = Math.floor(matchTime % 60);
                document.getElementById('timer').innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;

                players.forEach(p => p.updateAI(ball, dt));
                ball.update(dt); players.forEach(p => p.update(dt));
                players.forEach(p => resolveCollision(p, ball));
                for (let i = 0; i < players.length; i++) {
                    for (let j = i + 1; j < players.length; j++) { resolveCollision(players[i], players[j]); }
                }
                checkGoal();
            } else if (GAME_STATE === 'GOAL') {
                goalCooldown -= dt;
                if (goalCooldown <= 0) {
                    document.getElementById('goalText').style.display = 'none'; ball.reset();
                    players.forEach(p => { p.pos.x = p.basePos.x; p.pos.y = p.basePos.y; p.vel.mult(0); });
                    GAME_STATE = 'PLAYING';
                }
            }

            drawField(CTX); ball.draw(CTX); players.forEach(p => p.draw(CTX));
            if (GAME_STATE !== 'MENU') requestAnimationFrame(gameLoop);
        }

        function startSimulation() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            CANVAS.style.display = 'block';
            
            initGame();
            GAME_STATE = 'PLAYING';
            lastTimestamp = performance.now();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
