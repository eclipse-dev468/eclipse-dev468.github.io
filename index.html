<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECLIPSE: PRO LEAGUE 2D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0a0a0f; font-family: 'Orbitron', sans-serif;
            overflow: hidden; color: white; user-select: none;
        }

        /* TOP BAR (Monete FISSE e sempre visibili) */
        #topBar {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; box-sizing: border-box;
            background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0) 100%);
            z-index: 15;
        }
        .logo { font-size: 1.5em; font-weight: 900; color: #00ff88; text-shadow: 0 0 10px #00ff88; }
        .coins-display {
            background: rgba(0, 0, 0, 0.8); border: 1px solid #ffd700;
            padding: 8px 15px; border-radius: 8px; font-size: 1.2em; color: #ffd700;
            display: flex; align-items: center; gap: 10px; box-shadow: 0 0 10px rgba(255,215,0,0.3);
        }

        /* LAYOUT E CANVAS */
        #screenContainer {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        canvas { 
            background-color: #1a2f1a; 
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.1); 
            border-radius: 10px; 
            display: none; 
            max-width: 100%; max-height: 100%;
        }

        /* OVERLAY UI */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10; transition: opacity 0.3s;
        }
        .hidden { display: none !important; }

        /* BOTTONI */
        .btn {
            background: transparent; color: #00ff88; border: 2px solid #00ff88;
            padding: 15px 40px; font-size: 1.2em; font-family: 'Orbitron', sans-serif;
            cursor: pointer; border-radius: 8px; transition: all 0.2s;
            text-transform: uppercase; font-weight: bold; margin: 10px; width: 320px;
        }
        .btn:hover { background: #00ff88; color: #0a0a0f; box-shadow: 0 0 30px #00ff88; transform: scale(1.05); }
        .btn-red { color: #e63946; border-color: #e63946; }
        .btn-red:hover { background: #e63946; color: #fff; box-shadow: 0 0 30px #e63946; }

        h1 { font-size: 4em; margin: 0; color: #00ff88; text-shadow: 0 0 20px #00ff88; }
        h2 { color: #e63946; margin-bottom: 20px; }

        /* LISTE (Negozio/Squadra/Pacchetti) */
        .list-container {
            width: 80%; max-width: 800px; height: 55vh; overflow-y: auto;
            background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 10px;
            padding: 20px; margin-top: 20px;
        }
        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; border-bottom: 1px solid #333; transition: background 0.2s;
        }
        .item-row:hover { background: rgba(255,255,255,0.05); }
        .item-name { font-size: 1.2em; font-weight: bold; }
        .item-ovr { color: #00ff88; font-size: 1.5em; }
        .item-btn {
            background: #e63946; color: white; border: none; padding: 8px 15px;
            border-radius: 5px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-weight: bold;
        }
        .item-btn:disabled { background: #555; cursor: not-allowed; }

        /* HUD PARTITA */
        #hud { position: absolute; top: 70px; width: 100%; display: flex; justify-content: center; z-index: 5; pointer-events: none; }
        .scoreboard {
            background: rgba(0, 0, 0, 0.85); border: 2px solid #e63946; border-radius: 10px;
            padding: 10px 30px; display: flex; align-items: center; gap: 20px;
            font-size: 2em; font-weight: 900; box-shadow: 0 0 20px rgba(230, 57, 70, 0.5);
        }
        .team-name { color: #fff; font-size: 0.6em; letter-spacing: 2px; }
        #timer { color: #00ff88; font-size: 1.2em; }

        /* EFFETTO GOAL */
        .goal-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 6em; color: #00ff88; text-shadow: 0 0 40px #00ff88;
            font-weight: 900; z-index: 20; display: none; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0); } 100% { transform: translate(-50%, -50%) scale(1); } }

        /* RISULTATO */
        #resultScreen { text-align: center; }
        .final-score { font-size: 5em; color: #fff; margin: 20px 0; text-shadow: 0 0 20px #fff; }
    </style>
</head>
<body>

    <div id="topBar">
        <div class="logo">ECLIPSE FC</div>
        <div class="coins-display">
            <span>🪙</span>
            <span id="coinAmount">1000</span> AC
        </div>
    </div>

    <div id="screenContainer">
        <!-- 1. MENU PRINCIPALE -->
        <div id="mainMenu" class="screen">
            <h1>PRO LEAGUE 2D</h1>
            <h2>IL CALCIO, LA NOSTRA SFIDA</h2>
            <button class="btn" onclick="startMatch()">GIOCA PARTITA</button>
            <button class="btn" onclick="openScreen('teamScreen')">LA TUA SQUADRA</button>
            <button class="btn" onclick="openScreen('shopScreen')">NEGOZIO</button>
            <button class="btn" onclick="openScreen('packScreen')">PACCHETTI</button>
        </div>

        <!-- 2. SQUADRA -->
        <div id="teamScreen" class="screen hidden">
            <h2>ECLIPSE FC - ROSA</h2>
            <div class="list-container" id="teamList"></div>
            <button class="btn btn-red" onclick="backToMenu()" style="margin-top: 20px;">INDIETRO</button>
        </div>

        <!-- 3. NEGOZIO -->
        <div id="shopScreen" class="screen hidden">
            <h2>MERCATO GIOCATORI</h2>
            <div class="list-container" id="shopList"></div>
            <button class="btn btn-red" onclick="backToMenu()" style="margin-top: 20px;">INDIETRO</button>
        </div>

        <!-- 4. PACCHETTI -->
        <div id="packScreen" class="screen hidden">
            <h2>APRI PACCHETTI</h2>
            <div class="list-container" id="packList" style="height: 40vh;"></div>
            <button class="btn btn-red" onclick="backToMenu()" style="margin-top: 20px;">INDIETRO</button>
        </div>

        <!-- 5. PARTITA E HUD -->
        <div id="hud" class="hidden">
            <div class="scoreboard">
                <div class="team-name">ECLIPSE FC</div>
                <div id="score-home">0</div> - <div id="score-away">0</div>
                <div class="team-name">NEON TIGERS</div>
                <div style="margin-left: 20px; border-left: 1px solid #444; padding-left: 20px;">
                    <span id="timer">01:30</span>
                </div>
            </div>
        </div>
        <div id="goalText" class="goal-text">GOAL!</div>
        <canvas id="gameCanvas"></canvas>

        <!-- 6. FINE PARTITA -->
        <div id="resultScreen" class="screen hidden">
            <h2>FINE PARTITA</h2>
            <div class="final-score" id="finalScore">0 - 0</div>
            <button class="btn" onclick="location.reload()">TORNA AL MENU</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. DATI DI GIOCO (NOMI INVENTATI)
        // ==========================================
        let coins = 1000;
        
        let myTeam = [
            { name: "L. VANCE", ovr: 114, pos: "ATT" },
            { name: "K. RYDER", ovr: 116, pos: "ATT" },
            { name: "M. KANE", ovr: 65, pos: "POR" },
            { name: "D. ROCKS", ovr: 68, pos: "DIF" },
            { name: "S. BLADE", ovr: 67, pos: "DIF" },
            { name: "J. STORM", ovr: 72, pos: "CEN" }
        ];

        let shopData = [
            { name: "C. VELTRO", ovr: 99, price: 800 },
            { name: "L. ASTRO", ovr: 98, price: 700 },
            { name: "R. TITANO", ovr: 97, price: 600 },
            { name: "K. FULMINE", ovr: 96, price: 550 },
            { name: "V. FALCO", ovr: 95, price: 520 }
        ];

        function updateCoinsUI() { document.getElementById('coinAmount').innerText = coins; }

        // ==========================================
        // 2. GESTIONE SCHERMATE UI
        // ==========================================
        function backToMenu() {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('mainMenu').classList.remove('hidden');
        }

        function openScreen(id) {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
            if(id === 'teamScreen') renderTeam();
            if(id === 'shopScreen') renderShop();
            if(id === 'packScreen') renderPacks();
        }

        function renderTeam() {
            const container = document.getElementById('teamList');
            container.innerHTML = '';
            myTeam.sort((a,b) => b.ovr - a.ovr).forEach(p => {
                container.innerHTML += `
                    <div class="item-row">
                        <div>
                            <div class="item-name">${p.name}</div>
                            <div style="color: #888; font-size: 0.8em;">${p.pos}</div>
                        </div>
                        <div class="item-ovr">${p.ovr} OVR</div>
                    </div>
                `;
            });
        }

        function renderShop() {
            const container = document.getElementById('shopList');
            container.innerHTML = '';
            shopData.forEach((p, index) => {
                let btn = `<button class="item-btn" onclick="buyPlayer(${index})" ${coins < p.price ? 'disabled' : ''}>ACQUISTA (${p.price})</button>`;
                container.innerHTML += `
                    <div class="item-row">
                        <div><div class="item-name">${p.name}</div><div style="color: #00ff88;">${p.ovr} OVR</div></div>
                        ${btn}
                    </div>`;
            });
        }

        function buyPlayer(index) {
            const p = shopData[index];
            if (coins >= p.price) {
                coins -= p.price; updateCoinsUI();
                myTeam.push({ name: p.name, ovr: p.ovr, pos: "CEN" });
                shopData.splice(index, 1);
                renderShop();
                alert(`Hai acquistato ${p.name}!`);
            }
        }

        function renderPacks() {
            const container = document.getElementById('packList');
            container.innerHTML = `
                <div class="item-row">
                    <div><div class="item-name">PACCHETTO BRONZE</div><div style="color: #cd7f32;">50 AC</div></div>
                    <button class="item-btn" onclick="buyPack(50)">APRI</button>
                </div>
                <div class="item-row">
                    <div><div class="item-name">PACCHETTO SILVER</div><div style="color: #b0b0b0;">100 AC</div></div>
                    <button class="item-btn" onclick="buyPack(100)">APRI</button>
                </div>
                <div class="item-row">
                    <div><div class="item-name">PACCHETTO GOLD</div><div style="color: #ffd700;">200 AC</div></div>
                    <button class="item-btn" onclick="buyPack(200)">APRI</button>
                </div>
            `;
        }

        function buyPack(cost) {
            if (coins >= cost) {
                coins -= cost; updateCoinsUI();
                const randomName = "PLAYER " + Math.floor(Math.random() * 1000);
                const randomOvr = Math.floor(Math.random() * (99 - 70 + 1)) + 70;
                myTeam.push({ name: randomName, ovr: randomOvr, pos: "CEN" });
                alert(`Hai trovato ${randomName} (${randomOvr} OVR)!`);
            } else {
                alert("Monete insufficienti!");
            }
        }

        // ==========================================
        // 3. MOTORE FISICO E GIOCO (IA SENSATA)
        // ==========================================
        class Vector2 {
            constructor(x = 0, y = 0) { this.x = x; this.y = y; }
            add(v) { this.x += v.x; this.y += v.y; return this; }
            sub(v) { this.x -= v.x; this.y -= v.y; return this; }
            mult(n) { this.x *= n; this.y *= n; return this; }
            div(n) { this.x /= n; this.y /= n; return this; }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            norm() { let m = this.mag(); if (m !== 0) { this.div(m); } return this; }
            dist(v) { return Math.hypot(this.x - v.x, this.y - v.y); }
            static dist(v1, v2) { return Math.hypot(v1.x - v2.x, v1.y - v2.y); }
            clone() { return new Vector2(this.x, this.y); }
        }

        const CANVAS = document.getElementById('gameCanvas');
        const CTX = CANVAS.getContext('2d');
        const FIELD_WIDTH = 1000;
        const FIELD_HEIGHT = 600;
        CANVAS.width = FIELD_WIDTH; CANVAS.height = FIELD_HEIGHT;

        let GAME_STATE = 'MENU'; 
        let matchTime = 90; 
        let lastTimestamp = 0;
        let goalCooldown = 0;
        
        const SIMULATION_SPEED = 1.0; 
        const PLAYER_FORCE = 1.0; 
        const PLAYER_FRICTION = 0.85;
        const BALL_FRICTION = 0.96;

        class Entity {
            constructor(x, y, radius, mass, color) {
                this.pos = new Vector2(x, y); this.vel = new Vector2(0, 0); this.acc = new Vector2(0, 0);
                this.radius = radius; this.mass = mass; this.color = color;
                this.friction = PLAYER_FRICTION; this.restitution = 0.5;
            }
            applyForce(force) { this.acc.add(force); }
            update(dt) {
                this.vel.add(this.acc);
                this.pos.x += this.vel.x * dt * 60;
                this.pos.y += this.vel.y * dt * 60;
                this.vel.mult(this.friction);
                this.acc.mult(0);
                if (this.pos.x - this.radius < 0) { this.pos.x = this.radius; this.vel.x *= -this.restitution; }
                if (this.pos.x + this.radius > FIELD_WIDTH) { this.pos.x = FIELD_WIDTH - this.radius; this.vel.x *= -this.restitution; }
                if (this.pos.y - this.radius < 0) { this.pos.y = this.radius; this.vel.y *= -this.restitution; }
                if (this.pos.y + this.radius > FIELD_HEIGHT) { this.pos.y = FIELD_HEIGHT - this.radius; this.vel.y *= -this.restitution; }
            }
            draw(ctx) {
                ctx.beginPath(); ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.fill(); ctx.closePath();
            }
        }

        class Ball extends Entity {
            constructor(x, y) { super(x, y, 8, 0.5, '#ffffff'); this.friction = BALL_FRICTION; this.restitution = 0.8; this.lastTouch = null; }
            reset() { this.pos = new Vector2(FIELD_WIDTH / 2, FIELD_HEIGHT / 2); this.vel = new Vector2(0, 0); this.acc = new Vector2(0, 0); }
            draw(ctx) {
                super.draw(ctx);
                ctx.beginPath(); ctx.arc(this.pos.x, this.pos.y, this.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = '#000'; ctx.fill(); ctx.closePath();
            }
        }

        class Player extends Entity {
            constructor(x, y, teamColor, role, isHome) {
                super(x, y, 14, 1, teamColor);
                this.role = role; 
                this.basePos = new Vector2(x, y); 
                this.isHome = isHome;
            }

            updateAI(ball, allPlayers, dt) {
                let distToBall = Vector2.dist(this.pos, ball.pos);
                let target = this.basePos.clone();

                if (this.role === 'POR') {
                    target.y = Math.max(FIELD_HEIGHT/2 - 60, Math.min(FIELD_HEIGHT/2 + 60, ball.pos.y));
                    if (distToBall < 120) target.x = ball.pos.x;
                } else {
                    let isClosestToBall = true;
                    for (let p of allPlayers) {
                        if (p !== this && p.isHome === this.isHome && p.role !== 'POR') {
                            if (Vector2.dist(p.pos, ball.pos) < distToBall) { isClosestToBall = false; break; }
                        }
                    }

                    if (isClosestToBall) {
                        if (distToBall < 250 || (this.isHome && ball.pos.x > 300) || (!this.isHome && ball.pos.x < 700)) {
                            target = ball.pos.clone();
                            if (distToBall < this.radius + ball.radius + 10) {
                                let inShootingZone = this.isHome ? (ball.pos.x > 700) : (ball.pos.x < 300);
                                if (inShootingZone) {
                                    let shootDir = this.isHome ? new Vector2(1, (Math.random() - 0.5) * 0.3).norm() : new Vector2(-1, (Math.random() - 0.5) * 0.3).norm();
                                    ball.applyForce(shootDir.mult(25));
                                    ball.lastTouch = this;
                                } else {
                                    let bestPassTarget = null;
                                    let bestDistance = -1;
                                    for (let p of allPlayers) {
                                        if (p !== this && p.isHome === this.isHome && p.role !== 'POR') {
                                            let advance = this.isHome ? (p.pos.x - this.pos.x) : (this.pos.x - p.pos.x);
                                            if (advance > 0 && advance > bestDistance) { bestDistance = advance; bestPassTarget = p; }
                                        }
                                    }
                                    if (bestPassTarget) {
                                        let passDir = new Vector2(bestPassTarget.pos.x - ball.pos.x, bestPassTarget.pos.y - ball.pos.y).norm();
                                        ball.applyForce(passDir.mult(15));
                                        ball.lastTouch = this;
                                    } else {
                                        let shootDir = this.isHome ? new Vector2(1, (Math.random() - 0.5) * 0.5).norm() : new Vector2(-1, (Math.random() - 0.5) * 0.5).norm();
                                        ball.applyForce(shootDir.mult(20));
                                        ball.lastTouch = this;
                                    }
                                }
                            }
                        } else {
                            let ballInOpponentHalf = this.isHome ? ball.pos.x > FIELD_WIDTH / 2 : ball.pos.x < FIELD_WIDTH / 2;
                            let offsetX = ballInOpponentHalf ? 150 : -50;
                            target.x = this.basePos.x + offsetX;
                            target.y = this.basePos.y + (ball.pos.y - FIELD_HEIGHT/2) * 0.3;
                        }
                    } else {
                        if (this.isHome) {
                            target.x = Math.min(this.basePos.x, ball.pos.x - 100);
                            target.y = this.basePos.y + (ball.pos.y - FIELD_HEIGHT/2) * 0.2;
                        } else {
                            target.x = Math.max(this.basePos.x, ball.pos.x + 100);
                            target.y = this.basePos.y + (ball.pos.y - FIELD_HEIGHT/2) * 0.2;
                        }
                    }
                }

                let dir = new Vector2(target.x - this.pos.x, target.y - this.pos.y).norm();
                this.applyForce(dir.mult(PLAYER_FORCE));
            }
        }

        function resolveCollision(e1, e2) {
            let dist = Vector2.dist(e1.pos, e2.pos);
            let minDist = e1.radius + e2.radius;
            if (dist < minDist && dist > 0) {
                let nx = (e2.pos.x - e1.pos.x) / dist;
                let ny = (e2.pos.y - e1.pos.y) / dist;
                let overlap = minDist - dist;
                e1.pos.x -= nx * overlap * 0.5; e1.pos.y -= ny * overlap * 0.5;
                e2.pos.x += nx * overlap * 0.5; e2.pos.y += ny * overlap * 0.5;
                let rvx = e2.vel.x - e1.vel.x; let rvy = e2.vel.y - e1.vel.y;
                let normalVelocity = rvx * nx + rvy * ny;
                if (normalVelocity > 0) return;
                let e = Math.min(e1.restitution, e2.restitution);
                let j = -(1 + e) * normalVelocity / (1/e1.mass + 1/e2.mass);
                let impulseX = j * nx; let impulseY = j * ny;
                e1.vel.x -= impulseX / e1.mass; e1.vel.y -= impulseY / e1.mass;
                e2.vel.x += impulseX / e2.mass; e2.vel.y += impulseY / e2.mass;
            }
        }

        let ball, players = [], scoreHome = 0, scoreAway = 0;

        function initGame() {
            ball = new Ball(FIELD_WIDTH / 2, FIELD_HEIGHT / 2);
            players = [];
            // ECLIPSE FC (Casa - Sinistra)
            players.push(new Player(50, FIELD_HEIGHT / 2, '#e63946', 'POR', true));
            players.push(new Player(200, FIELD_HEIGHT / 4, '#e63946', 'DIF', true));
            players.push(new Player(200, FIELD_HEIGHT / 2, '#e63946', 'DIF', true));
            players.push(new Player(200, FIELD_HEIGHT * 0.75, '#e63946', 'DIF', true));
            players.push(new Player(400, FIELD_HEIGHT / 3, '#e63946', 'CEN', true));
            players.push(new Player(400, FIELD_HEIGHT * 0.66, '#e63946', 'CEN', true));
            players.push(new Player(600, FIELD_HEIGHT / 2, '#e63946', 'ATT', true));

            // NEON TIGERS (Ospiti - Destra)
            players.push(new Player(FIELD_WIDTH - 50, FIELD_HEIGHT / 2, '#00b894', 'POR', false));
            players.push(new Player(FIELD_WIDTH - 200, FIELD_HEIGHT / 4, '#00b894', 'DIF', false));
            players.push(new Player(FIELD_WIDTH - 200, FIELD_HEIGHT / 2, '#00b894', 'DIF', false));
            players.push(new Player(FIELD_WIDTH - 200, FIELD_HEIGHT * 0.75, '#00b894', 'DIF', false));
            players.push(new Player(FIELD_WIDTH - 400, FIELD_HEIGHT / 3, '#00b894', 'CEN', false));
            players.push(new Player(FIELD_WIDTH - 400, FIELD_HEIGHT * 0.66, '#00b894', 'CEN', false));
            players.push(new Player(FIELD_WIDTH - 600, FIELD_HEIGHT / 2, '#00b894', 'ATT', false));

            scoreHome = 0; scoreAway = 0; matchTime = 90;
            document.getElementById('score-home').innerText = "0"; document.getElementById('score-away').innerText = "0";
        }

        function drawField(ctx) {
            for(let i=0; i<10; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#1a3a1a' : '#1f421f';
                ctx.fillRect((FIELD_WIDTH/10)*i, 0, FIELD_WIDTH/10, FIELD_HEIGHT);
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(FIELD_WIDTH / 2, FIELD_HEIGHT / 2, 70, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(FIELD_WIDTH / 2, 0); ctx.lineTo(FIELD_WIDTH / 2, FIELD_HEIGHT); ctx.stroke();
            ctx.strokeRect(0, FIELD_HEIGHT / 2 - 120, 150, 240); 
            ctx.strokeRect(FIELD_WIDTH - 150, FIELD_HEIGHT / 2 - 120, 150, 240);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRect(0, FIELD_HEIGHT / 2 - 40, 8, 80); 
            ctx.fillRect(FIELD_WIDTH - 8, FIELD_HEIGHT / 2 - 40, 8, 80);
        }

        function checkGoal() {
            if (ball.pos.x > FIELD_WIDTH - ball.radius && ball.pos.y > FIELD_HEIGHT / 2 - 40 && ball.pos.y < FIELD_HEIGHT / 2 + 40) { scoreHome++; triggerGoal("ECLIPSE FC"); }
            else if (ball.pos.x < ball.radius && ball.pos.y > FIELD_HEIGHT / 2 - 40 && ball.pos.y < FIELD_HEIGHT / 2 + 40) { scoreAway++; triggerGoal("NEON TIGERS"); }
        }

        function triggerGoal(team) {
            GAME_STATE = 'GOAL'; goalCooldown = 2.0;
            const gt = document.getElementById('goalText'); gt.innerText = `GOAL! ${team}`; gt.style.display = 'block';
            document.getElementById('score-home').innerText = scoreHome; document.getElementById('score-away').innerText = scoreAway;
        }

        function gameLoop(timestamp) {
            let dt = (timestamp - lastTimestamp) / 1000; 
            if (dt > 0.1) dt = 0.1;
            lastTimestamp = timestamp;

            if (GAME_STATE === 'PLAYING') {
                matchTime -= dt;
                if (matchTime <= 0) {
                    matchTime = 0; GAME_STATE = 'GAMEOVER';
                    document.getElementById('finalScore').innerText = `${scoreHome} - ${scoreAway}`;
                    document.getElementById('resultScreen').classList.remove('hidden');
                }
                let min = Math.floor(matchTime / 60); let sec = Math.floor(matchTime % 60);
                document.getElementById('timer').innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;

                players.forEach(p => p.updateAI(ball, players, dt));
                ball.update(dt); 
                players.forEach(p => p.update(dt));
                
                players.forEach(p => resolveCollision(p, ball));
                for (let i = 0; i < players.length; i++) {
                    for (let j = i + 1; j < players.length; j++) { resolveCollision(players[i], players[j]); }
                }
                checkGoal();
            } else if (GAME_STATE === 'GOAL') {
                goalCooldown -= dt;
                if (goalCooldown <= 0) {
                    document.getElementById('goalText').style.display = 'none'; ball.reset();
                    players.forEach(p => { p.pos.x = p.basePos.x; p.pos.y = p.basePos.y; p.vel.mult(0); });
                    GAME_STATE = 'PLAYING';
                }
            }

            drawField(CTX); 
            ball.draw(CTX); 
            players.forEach(p => p.draw(CTX));
            
            if (GAME_STATE !== 'MENU') requestAnimationFrame(gameLoop);
        }

        function startMatch() {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('hud').classList.remove('hidden');
            CANVAS.style.display = 'block';
            
            initGame();
            GAME_STATE = 'PLAYING';
            lastTimestamp = performance.now();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
